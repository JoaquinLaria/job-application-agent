name: hw4-agent

# Homework 4: offer a service, hire another agent, check and use its work.
# One cycle every half hour until the run window closes (14 Oct, 11:59pm Boston).
# Each cycle makes at most one Canvas write; the agent reads the HW4 control
# line before every write and stops itself after three failed cycles in a row.
on:
  schedule:
    - cron: "11,41 * 12-15 10 *"   # twice an hour: GitHub sometimes skips scheduled runs
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = decide but never write to Canvas"
        required: false
        default: "0"

concurrency:
  group: forum-agent          # shares the lock with the HW3 agent: never two writers at once
  cancel-in-progress: false

permissions:
  contents: write             # only to commit memory and the accepted result back

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683     # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q "requests==2.34.2"
      - name: Run one cycle
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          PARLEY_KEY: ${{ secrets.PARLEY_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python forum_agent/hw4.py
      - name: Build the write-up PDF and submit it to Canvas when due
        continue-on-error: true   # a report problem must never block saving the agent's memory
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          PARLEY_KEY: unused
        run: python forum_agent/hw4_report.py --submit-if-due
      - name: Run the tests, including any accepted peer cases
        run: python -m unittest discover -s tests -p "test_*plain*.py" -q || true
      - name: Save memory and result
        if: always()
        run: |
          git config user.name "forum-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forum_agent/state forum_agent/hw4_output; git add tests/test_plain_peer_cases.py 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "hw4 agent: cycle state"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
